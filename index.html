<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrOutfit</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f0f0f;
color:#fff;
}

.header{
padding:30px 20px;
text-align:center;
background:#181818;
border-bottom:2px solid gold;
}

.logo{
width:110px;
height:110px;
object-fit:contain;
margin-bottom:15px;
}

.header h1{
font-size:38px;
color:gold;
}

.sub{
color:#ddd;
margin-top:10px;
}

.search{
padding:20px;
}

.search input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
background:#222;
color:#fff;
}

.kategori{
display:flex;
justify-content:center;
gap:10px;
padding:10px 20px 25px;
flex-wrap:wrap;
}

.kategori button{
padding:10px 18px;
border:none;
border-radius:30px;
background:gold;
color:#111;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.kategori button:hover{
background:#fff;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1a1a1a;
border-radius:18px;
overflow:hidden;
transition:.3s;
box-shadow:0 0 15px rgba(0,0,0,.4);
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card h3{
padding:15px 15px 5px;
color:gold;
}

.card p{
padding:0 15px 15px;
color:#ccc;
}

.card a{
display:block;
background:gold;
color:#111;
text-align:center;
padding:14px;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

.card a:hover{
background:#ffd700;
} 

<style>
  
</head>

<script>

function cariProduk(){

let input=document.getElementById("search").value.toUpperCase();

let card=document.querySelectorAll(".card");

card.forEach(function(item){

let text=item.innerText.toUpperCase();

if(text.indexOf(input)>-1){

item.style.display="block";

}else{

item.style.display="none";

}

});

}


function filterProduk(kategori){

let card=document.querySelectorAll(".card");

card.forEach(function(item){

if(kategori=="all"){

item.style.display="block";

}

else if(item.classList.contains(kategori)){

item.style.display="block";

}

else{

item.style.display="none";

}

});

}

</script>
