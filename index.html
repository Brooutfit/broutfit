<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrOutfit</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:#fff;
padding:25px;
}

h1{
text-align:center;
margin-bottom:10px;
}

p{
text-align:center;
color:#bbb;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
margin-bottom:25px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:20px;
}

.card{
background:#1f1f1f;
border-radius:12px;
overflow:hidden;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:10px;
font-size:18px;
}

.card a{
display:block;
text-align:center;
background:#00c853;
color:white;
padding:12px;
text-decoration:none;
font-weight:bold;
}

.card a:hover{
background:#00a846;
}
</style>

</head>

<body>

<h1>BrOutfit</h1>

<p>Cari Outfit Favoritmu 🔥</p>

<input
type="text"
id="search"
placeholder="Cari kode..."
onkeyup="cariProduk()">

<div class="grid" id="produk">

<div class="card">
<img src="https://via.placeholder.com/300x300.png?text=NG001">
<h3>NG001 - Kemeja Casual</h3>
<a href="https://shopee.co.id" target="_blank">
Lihat Produk
</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300.png?text=NG002">
<h3>NG002 - Cargo Cream</h3>
<a href="https://shopee.co.id" target="_blank">
Lihat Produk
</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300.png?text=NG003">
<h3>NG003 - Sneakers</h3>
<a href="https://shopee.co.id" target="_blank">
Lihat Produk
</a>
</div>

</div>

<script>

function cariProduk(){

let input=document.getElementById("search").value.toUpperCase();

let card=document.getElementsByClassName("card");

for(let i=0;i<card.length;i++){

let text=card[i].innerText.toUpperCase();

if(text.indexOf(input)>-1){

card[i].style.display="block";

}else{

card[i].style.display="none";

}

}

}

</script>

</body>
</html>
